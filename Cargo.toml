[workspace]
resolver = "2"
members = [
    "crates/wahtuh-audio",
    "crates/wahtuh-transcribe",
    "crates/wahtuh-normalize",
    "crates/wahtuh-providers",
    "crates/wahtuh-config",
    "crates/wahtuh-core",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/desukab/wahtuh-pho"
# NOTE: the shipped Android app is built without Gradle and does not link these
# crates. The research workspace uses whisper-rs for local inference; the
# provider crate has no HTTP transport. See README.md for the app path.
